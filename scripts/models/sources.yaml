# Which BodyParts3D 3.0 meshes (99% reduced OBJ, CC BY-SA 2.1 JP) build each node of public/models/brain.glb.
# Files live in scripts/models/raw/obj/BodyParts3D_3.0_obj_99/ (git-ignored; see scripts/models/README.md).
# split: keep only triangles on this side of the midline (for meshes that cover both hemispheres).
dataset: BodyParts3D_3.0_obj_99
simplify: { ratio: 0.6, error: 0.001 }
nodes:
