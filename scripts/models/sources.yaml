  parietal-lobe_R: { files: [BP50, FMA72667, FMA72669] }
  temporal-lobe_L: { files: [FMA72686, FMA72688, FMA72690, FMA72706, FMA72801] }
  temporal-lobe_R: { files: [FMA72685, FMA72687, FMA72689, FMA72705, FMA72800, FMA72804] }
  occipital-lobe_L: { files: [FMA72976] }
  occipital-lobe_R: { files: [FMA72975] }
  cerebellum: { files: [FMA67944] }
  brainstem: { files: [FMA61993nsn, FMA62394, FMA73422, FMA73423, FMA73434, FMA73435, FMA67943, FMA62004] }
  hypothalamus: { files: [FMA62008nsn, FMA62327] }
