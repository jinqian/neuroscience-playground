id: u02-case-canned-food
type: case
title: { en: "The home-canned beans" }
sources: ["Clostridial Toxins: Botox", "Neurotransmitter Release", "Parasympathetics & Sympathetics"]
story:
  en: >-
    Maria, 45, ate home-canned green beans at a family lunch. The next day her eyelids drooped and she saw
    double. Now her arms feel weak, and the weakness is moving downward. She's fully alert and can feel
    everything normally.
clues:
  - id: k1
    verify: true
    text: { en: "Symptoms began about a day after the meal, starting with the eyes and face, then spreading down." }
  - id: k2
    text: { en: "Her pupils are wide and slow to react, and her mouth is very dry." }
    unlock:
      id: q1
      kind: mc
      prompt: { en: "Narrow pupils and saliva are driven by which branch, using which transmitter?" }
      options:
        - { id: a, text: { en: "Parasympathetic, using acetylcholine" } }
        - { id: b, text: { en: "Sympathetic, using noradrenaline" } }
        - { id: c, text: { en: "Enteric, using dopamine" } }
      answer: a
      explain: { en: "If acetylcholine release fails, parasympathetic jobs fail too: wide pupils, dry mouth." }
  - id: k3
    text: { en: "When a doctor stimulates her muscle directly with a small electric current, it contracts normally." }
    unlock:
      id: q2
      kind: tfwhy
      statement: { en: "If a muscle contracts when stimulated directly, the muscle itself is probably fine." }
      isTrue: true
      reasons:
        - { id: r1, text: { en: "The problem must lie upstream, in the message reaching the muscle." } }
        - { id: r2, text: { en: "Muscles only contract when the brain is asleep." } }
      answerReason: r1
      explain: { en: "The muscle works. It just isn't receiving the order to contract." }
final:
  prompt: { en: "Where in the synapse is the toxin acting? Tap it." }
  kind: tap2d
  figure: synapse
  answer: presynaptic-terminal
  explanations:
    presynaptic-terminal: { en: "Yes. Botulinum toxin enters the nerve terminal and cuts SNARE proteins, so vesicles of acetylcholine can't be released." }
    vesicle: { en: "Close! The vesicles are full and ready, but they can't fuse. The toxin targets the release machinery in the terminal, not the vesicle's contents." }
    cleft: { en: "The cleft is just the gap. The problem is that nothing is being released into it." }
    receptor: { en: "Blocking acetylcholine receptors also causes weakness (as in myasthenia gravis), but this toxin works before release." }
    postsynaptic: { en: "The muscle responded to direct stimulation, so the receiving cell is working." }
    reuptake-transporter: { en: "Blocking reuptake would leave more transmitter around, not less." }
solved:
  en: >-
    Maria has [[botulinum-toxin|botulism]]: badly canned food can grow Clostridium botulinum. The toxin stops
    [[acetylcholine]] release at muscles and parasympathetic nerves. She needs antitoxin and hospital care,
    sometimes with breathing support, while her nerve terminals slowly recover.
