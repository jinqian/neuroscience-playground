# 3D brain structures. meshNodes name nodes in public/models/brain.glb.
- id: frontal-lobe
  name:
    en: "Frontal lobe"
    fr: "Lobe frontal"
    zh: "额叶"
  note:
    en: "The front of each hemisphere. It plans, decides and controls movement; its rear strip is the primary motor cortex, and on the left it holds Broca's area for speech."
    fr: "L'avant de chaque hémisphère. Il planifie, décide et commande les mouvements ; sa bande arrière est le cortex moteur primaire et, à gauche, il abrite l'aire de Broca pour la parole."
    zh: "每个大脑半球的前部。它负责计划、决策和控制运动；它后方的条带是初级运动皮层，左侧还有负责说话的布罗卡区。"
  units: [u01]
  meshNodes: [frontal-lobe_L, frontal-lobe_R]
- id: parietal-lobe
  name:
    en: "Parietal lobe"
    fr: "Lobe pariétal"
    zh: "顶叶"
  note:
    en: "Behind the frontal lobe. It handles touch and body sense (its front strip is the primary somatosensory cortex) and works out where things are in space."
    fr: "Derrière le lobe frontal. Il traite le toucher et les sensations du corps (sa bande avant est le cortex somatosensoriel primaire) et situe les objets dans l'espace."
    zh: "位于额叶后方。它处理触觉和身体感觉（它前方的条带是初级躯体感觉皮层），并判断物体在空间中的位置。"
  units: []
  meshNodes: [parietal-lobe_L, parietal-lobe_R]
- id: temporal-lobe
  name:
    en: "Temporal lobe"
    fr: "Lobe temporal"
    zh: "颞叶"
  note:
    en: "Along the side, by the ears. It handles hearing, holds Wernicke's area for understanding language on the left, and helps form memories."
    fr: "Sur le côté, au niveau des oreilles. Il traite l'audition, abrite à gauche l'aire de Wernicke pour comprendre le langage et aide à former les souvenirs."
    zh: "位于两侧、靠近耳朵。它处理听觉，左侧有负责理解语言的韦尼克区，并参与形成记忆。"
  units: []
  meshNodes: [temporal-lobe_L, temporal-lobe_R]
- id: occipital-lobe
  name:
    en: "Occipital lobe"
    fr: "Lobe occipital"
    zh: "枕叶"
  note:
    en: "At the back of the brain. It is where vision is first processed in the cortex."
    fr: "À l'arrière du cerveau. C'est là que la vision est d'abord traitée dans le cortex."
    zh: "位于大脑后部。视觉信息首先在这里的皮层中被处理。"
  units: []
  meshNodes: [occipital-lobe_L, occipital-lobe_R]
- id: cerebellum
  name:
    en: "Cerebellum"
    fr: "Cervelet"
    zh: "小脑"
  note:
    en: "Tucked under the back of the brain. It fine-tunes movement, balance and timing, and learns from errors."
    fr: "Logé sous l'arrière du cerveau. Il affine les mouvements, l'équilibre et le timing, et apprend de ses erreurs."
    zh: "藏在大脑后部的下方。它微调运动、平衡和时机，并从错误中学习。"
  units: [u01]
  meshNodes: [cerebellum]
- id: brainstem
  name:
    en: "Brainstem"
    fr: "Tronc cérébral"
    zh: "脑干"
  note:
    en: "Connects the brain to the spinal cord: midbrain, pons and medulla. It runs breathing, heart rate and many reflexes, and carries the cranial nerves."
    fr: "Relie le cerveau à la moelle épinière : mésencéphale, pont et bulbe rachidien. Il gère la respiration, le rythme cardiaque et de nombreux réflexes, et porte les nerfs crâniens."
    zh: "连接大脑与脊髓，由中脑、脑桥和延髓组成。它掌管呼吸、心率和许多反射，脑神经也从这里发出。"
  units: [u02]
  meshNodes: [brainstem]
- id: spinal-cord
  name:
    en: "Spinal cord"
    fr: "Moelle épinière"
    zh: "脊髓"
  note:
    en: "The CNS cable running down inside the spine. It carries signals between brain and body, and runs reflexes on its own."
    fr: "Le câble du SNC qui descend dans la colonne vertébrale. Il transporte les signaux entre le cerveau et le corps, et gère seul certains réflexes."
    zh: "沿脊柱内部向下延伸的中枢神经系统“电缆”。它在大脑和身体之间传递信号，还能独立完成反射。"
  units: [u01, u02]
  meshNodes: []
  twoDOnly: true
- id: hypothalamus
  name:
    en: "Hypothalamus"
    fr: "Hypothalamus"
    zh: "下丘脑"
  note:
    en: "A small region under the thalamus that keeps the body in balance: temperature, hunger, thirst, hormones (via the pituitary) and the autonomic nervous system."
    fr: "Une petite région sous le thalamus qui maintient l'équilibre du corps : température, faim, soif, hormones (via l'hypophyse) et système nerveux autonome."
    zh: "丘脑下方的一个小区域，负责维持身体的平衡：体温、饥饿、口渴、激素（通过垂体）以及自主神经系统。"
  units: [u02]
  meshNodes: [hypothalamus]
- id: thalamus
  name:
    en: "Thalamus"
    fr: "Thalamus"
    zh: "丘脑"
  note:
    en: "A pair of egg-shaped hubs deep in the forebrain, one per hemisphere. Almost every sense (except smell) passes through it on the way to the cortex. It grows from the diencephalon."
    fr: "Une paire de relais en forme d'œuf au fond du cerveau antérieur, un par hémisphère. Presque tous les sens (sauf l'odorat) y passent avant d'atteindre le cortex. Il provient du diencéphale."
    zh: "前脑深处一对蛋形的中继站，每个半球一个。几乎所有感觉（嗅觉除外）都要经过它才能到达皮层。它由间脑发育而来。"
  units: [u03]
  meshNodes: [thalamus_L, thalamus_R]
- id: corpus-callosum
  name:
    en: "Corpus callosum"
    fr: "Corps calleux"
    zh: "胼胝体"
  note:
    en: "The broad bridge of white matter joining the left and right hemispheres: about 200 million axons that let the two sides share what they know."
    fr: "Le large pont de substance blanche qui relie les hémisphères gauche et droit : environ 200 millions d'axones qui permettent aux deux côtés de partager ce qu'ils savent."
    zh: "连接左右大脑半球的宽阔白质桥梁：约两亿条轴突，让两侧共享各自的信息。"
  units: [u03]
  meshNodes: [corpus-callosum]
- id: ventricles
  name:
    en: "Ventricles"
    fr: "Ventricules"
    zh: "脑室"
  note:
    en: "Fluid-filled spaces inside the brain: two lateral ventricles, the third and the fourth. They are what is left of the neural tube's hollow centre, and they make and hold cerebrospinal fluid."
    fr: "Des cavités remplies de liquide à l'intérieur du cerveau : deux ventricules latéraux, le troisième et le quatrième. Ce sont les restes du centre creux du tube neural ; ils produisent et contiennent le liquide cérébrospinal."
    zh: "大脑内部充满液体的空腔：两个侧脑室、第三脑室和第四脑室。它们是神经管中空部分留下来的结构，负责产生并容纳脑脊液。"
  units: [u03]
  meshNodes: [ventricles_L, ventricles_R, ventricles]
- id: motor-strip
  name:
    en: "Motor strip (precentral gyrus)"
    fr: "Bande motrice (gyrus précentral)"
    zh: "运动带（中央前回）"
  note:
    en: "The primary motor cortex: the ridge just in front of the central sulcus. Each part of it moves a part of the opposite side of the body."
    fr: "Le cortex moteur primaire : la crête juste devant le sillon central. Chacune de ses parties fait bouger une partie du côté opposé du corps."
    zh: "初级运动皮层：中央沟正前方的那条脑回。它的每一部分控制对侧身体的一个部位的运动。"
  units: [u03]
  meshNodes: [motor-strip_L, motor-strip_R]
  partOf: frontal-lobe
- id: sensory-strip
  name:
    en: "Sensory strip (postcentral gyrus)"
    fr: "Bande sensitive (gyrus postcentral)"
    zh: "感觉带（中央后回）"
  note:
    en: "The primary somatosensory cortex: the ridge just behind the central sulcus. It feels touch, pain and position from the opposite side of the body."
    fr: "Le cortex somatosensoriel primaire : la crête juste derrière le sillon central. Il perçoit le toucher, la douleur et la position du côté opposé du corps."
    zh: "初级躯体感觉皮层：中央沟正后方的那条脑回。它感受对侧身体的触觉、痛觉和位置觉。"
  units: [u03]
  meshNodes: [sensory-strip_L, sensory-strip_R]
  partOf: parietal-lobe
- id: insula
  name:
    en: "Insula"
    fr: "Insula"
    zh: "岛叶"
  note:
    en: "A hidden lobe folded deep inside the lateral sulcus, covered by the frontal, parietal and temporal lobes. It handles taste and the feeling of your body's inner state."
    fr: "Un lobe caché, replié au fond du sillon latéral et recouvert par les lobes frontal, pariétal et temporal. Il traite le goût et la perception de l'état intérieur du corps."
    zh: "一个藏在外侧沟深处的脑叶，被额叶、顶叶和颞叶覆盖。它负责味觉以及对身体内部状态的感受。"
  units: [u03]
  meshNodes: [insula_L, insula_R]
- id: wernicke-area
  name:
    en: "Wernicke's area"
    fr: "Aire de Wernicke"
    zh: "韦尼克区"
  note:
    en: "The back of the left superior temporal gyrus, next to the hearing cortex. It is key to understanding language; damage leaves speech fluent but empty. Shown here as that part of the gyrus."
    fr: "L'arrière du gyrus temporal supérieur gauche, à côté du cortex auditif. Elle est essentielle à la compréhension du langage ; une lésion laisse un discours fluide mais vide. Représentée ici par cette partie du gyrus."
    zh: "左侧颞上回的后部，紧挨着听觉皮层。它对理解语言至关重要；受损后说话流利却空洞无意义。这里用颞上回的这一部分来表示。"
  units: [u03]
  meshNodes: [wernicke-area_L]
  partOf: temporal-lobe
- id: broca-area
  name:
    en: "Broca's area"
    fr: "Aire de Broca"
    zh: "布罗卡区"
  note:
    en: "Part of the left inferior frontal gyrus, just in front of the motor strip's face and mouth region. It is key to producing speech; damage makes speech slow and effortful."
    fr: "Une partie du gyrus frontal inférieur gauche, juste devant la région de la bande motrice qui commande le visage et la bouche. Elle est essentielle à la production de la parole ; une lésion rend la parole lente et laborieuse."
    zh: "左侧额下回的一部分，位于运动带中控制面部和口部区域的正前方。它对说话至关重要；受损后说话缓慢而费力。"
  units: [u03]
  meshNodes: []
  twoDOnly: true
  partOf: frontal-lobe
- id: cranial-nerves
  name:
    en: "Cranial nerves"
    fr: "Nerfs crâniens"
    zh: "脑神经"
  note:
    en: "Twelve pairs of nerves that leave the brain directly, most of them from the brainstem. They serve the head and neck, and the vagus nerve reaches the chest and gut."
    fr: "Douze paires de nerfs qui quittent directement l'encéphale, la plupart depuis le tronc cérébral. Ils innervent la tête et le cou, et le nerf vague atteint le thorax et l'intestin."
    zh: "直接从脑发出的十二对神经，大多数从脑干发出。它们支配头颈部，而迷走神经一直延伸到胸腔和肠道。"
  units: [u03]
  meshNodes: []
  twoDOnly: true
